appId: com.apollo-map-studio.app
productName: Apollo Map Studio
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!dist-electron/**/__tests__/**'
  - '!dist-electron/**/*.test.cjs'
  - '!dist-electron/**/*.spec.cjs'
  - '!dist-electron/**/*.map'
  - '!dist/**/*.map'
  - '!node_modules/**/*'
asar: true
npmRebuild: false
compression: normal
extraMetadata:
  main: dist-electron/main.cjs
  dependencies: {}
publish: null
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  maintainer: Apollo Map Studio <maintainers@apollo-map-studio.local>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
