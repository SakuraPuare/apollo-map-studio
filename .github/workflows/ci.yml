name: CI

on:
  push:
    branches: [main, v1]
    tags: ['v*']
  pull_request:
    branches: [main, v1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: Typecheck
            command: pnpm typecheck
          - task: ESLint
            command: pnpm lint
          - task: Prettier
            command: pnpm format:check
          - task: Unit tests
            command: pnpm test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run ${{ matrix.task }}
        run: ${{ matrix.command }}

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run benchmarks
        run: pnpm bench --outputJson bench-results.json

      - name: Perf budget guard
        continue-on-error: true
        run: node scripts/check-bench-budget.mjs bench-results.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: error

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build web app
        run: pnpm build:web

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: apollo-map-studio-web
          path: dist/
          if-no-files-found: error

  docs-build:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build documentation
        run: pnpm docs:build

  desktop-build:
    name: Desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download web build
        uses: actions/download-artifact@v5
        with:
          name: apollo-map-studio-web
          path: dist

      - name: Build desktop docs
        run: pnpm build:docs:desktop

      - name: Build hardened Electron assets
        run: pnpm build:electron:hardened
        env:
          APMS_LICENSE_PRIVATE_KEY_BASE64: ${{ secrets.APMS_LICENSE_PRIVATE_KEY_BASE64 }}

      - name: Verify Electron hardening
        run: pnpm verify:electron-hardening

      - name: Upload desktop build
        uses: actions/upload-artifact@v7
        with:
          name: apollo-map-studio-desktop-build
          path: |
            dist/
            dist-electron/
          if-no-files-found: error

  desktop-package:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: desktop-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder-args: --linux --x64
            artifact-name: apollo-map-studio-linux
          - os: macos-latest
            builder-args: --mac --x64 --arm64
            artifact-name: apollo-map-studio-macos
          - os: windows-latest
            builder-args: --win --x64
            artifact-name: apollo-map-studio-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download desktop build
        uses: actions/download-artifact@v5
        with:
          name: apollo-map-studio-desktop-build
          path: .

      - name: Package desktop artifacts
        run: pnpm exec electron-builder ${{ matrix.builder-args }} --publish never
        env:
          NODE_OPTIONS: --no-deprecation
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
            !release/**/builder-debug.yml
            !release/**/builder-effective-config.yaml
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, benchmarks, web-build, docs-build, desktop-package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v5
        with:
          name: apollo-map-studio-web
          path: artifacts/apollo-map-studio-web

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: apollo-map-studio-linux
          path: artifacts/apollo-map-studio-linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: apollo-map-studio-macos
          path: artifacts/apollo-map-studio-macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: apollo-map-studio-windows
          path: artifacts/apollo-map-studio-windows

      - name: Archive web artifact
        run: |
          cd artifacts/apollo-map-studio-web
          zip -r ../apollo-map-studio-web.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/apollo-map-studio-web.zip
            artifacts/apollo-map-studio-linux/*
            artifacts/apollo-map-studio-macos/*
            artifacts/apollo-map-studio-windows/*
