name: CI

on:
  push:
    branches: [main, v1]
    tags: ['v*']
  pull_request:
    branches: [main, v1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier formatting
        run: pnpm format:check

      - name: Web production build
        run: pnpm build:web

      - name: Documentation build
        run: pnpm docs:build

      - name: Unit tests
        run: pnpm test

      - name: Benchmarks
        run: pnpm bench --outputJson bench-results.json

      - name: Perf budget guard
        run: node scripts/check-bench-budget.mjs bench-results.json

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: apollo-map-studio-web
          path: dist/
          if-no-files-found: error

  desktop-package:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package-script: package:linux
            artifact-name: apollo-map-studio-linux
          - os: macos-latest
            package-script: package:mac
            artifact-name: apollo-map-studio-macos
          - os: windows-latest
            package-script: package:win
            artifact-name: apollo-map-studio-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop artifacts
        run: pnpm ${{ matrix.package-script }}
        env:
          APMS_LICENSE_PRIVATE_KEY_BASE64: ${{ secrets.APMS_LICENSE_PRIVATE_KEY_BASE64 }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
            !release/**/builder-debug.yml
            !release/**/builder-effective-config.yaml
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, desktop-package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Archive web artifact
        run: |
          cd artifacts/apollo-map-studio-web
          zip -r ../apollo-map-studio-web.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/apollo-map-studio-web.zip
            artifacts/apollo-map-studio-linux/*
            artifacts/apollo-map-studio-macos/*
            artifacts/apollo-map-studio-windows/*
