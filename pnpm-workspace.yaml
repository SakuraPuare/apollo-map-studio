packages:
  - .
  - tools/license-gen

allowBuilds:
  electron-winstaller: true
  esbuild: true
  msw: true

# pnpm settings.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '*'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - msw
overrides:
  fast-uri: '>=3.1.2'
  hono: '>=4.12.18'
  ip-address: '>=10.1.1'
  vite: '>=6.4.2'
  vitepress>vite: ^6.4.2
  esbuild: '>=0.25.0'
